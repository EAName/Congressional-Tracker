[project]
name = "va-congressional-tracker"
version = "0.2.0"
description = "Normalized, idempotent ingest pipeline for Virginia congressional roll calls"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "duckdb",
    "pyyaml",
    "typer",
    "tenacity",
    "structlog",
    "pytest",
    "pytest-httpx",
    "polars",
    "gspread",
    "google-auth",
    "jinja2",
    "pillow",
]

[project.scripts]
vact = "vact.cli:app"

[tool.uv]
# Prefer non-editable installs so site-packages contains a real vact package.
# Development uses bin/vact (PYTHONPATH=src) or `uv run --with-editable`.
config-settings = { editable_mode = "compat" }


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
