[project]
name = "va-congressional-tracker"
version = "0.2.0"
description = "Normalized, idempotent ingest pipeline for Virginia congressional roll calls"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "duckdb",
    "pyyaml",
    "typer",
    "tenacity",
    "structlog",
    "pytest",
    "pytest-httpx",
    "polars",
]

[project.scripts]
vact = "vact.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling auto-discovers src/vact; keep sources explicit for editable installs
[tool.hatch.build.targets.wheel]
packages = ["src/vact"]

[tool.hatch.build.targets.wheel.sources]
"src/vact" = "vact"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
