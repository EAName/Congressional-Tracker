[project]
name = "va-congressional-tracker"
version = "0.2.0"
description = "Normalized, idempotent ingest pipeline for Virginia congressional roll calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic>=2",
    "duckdb",
    "pyyaml",
    "typer",
    "tenacity",
    "structlog",
    "pytest",
    "pytest-httpx",
    "polars",
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "jinja2",
    "pillow",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
irt = [
    "pymc>=5.16",
    "arviz>=0.19",
]

[project.scripts]
vact = "vact.cli:app"

[tool.uv]
# Prefer non-editable installs so site-packages contains a real vact package.
# Development uses bin/vact (PYTHONPATH=src) or `uv run --with-editable`.
config-settings = { editable_mode = "compat" }


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "irt: Bayesian 2PL (requires `uv sync --extra irt`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
