# Generic-ballot poll average. Primary polls only — this file and
# data/generic_ballot_polls.csv are the archive; no aggregator output is ingested
# (SEAT_MODEL_SPEC.md "Do not scrape aggregators").
version: 2

# Recency half-life in days for the kernel weight at each grid date.
half_life_days: 14

# Daily trend grid extends this far back from the newest poll.
window_days: 600

# House effects: per-pollster mean residual, shrunk toward zero by
# n / (n + shrink_k). A firm with one poll keeps 1/(1+k) of its raw residual.
house_effect:
  shrink_k: 4.0
  iterations: 3
  max_abs: 0.06  # clamp; a >6pt house effect is a data error, not a lean

# Sample-type offsets applied toward a likely-voter basis, in two-party share
# points. Priors until the archive is deep enough to estimate them; a pollster
# publishing both LV and RV in the same release is the identifying case.
sample_type:
  reference: lv
  offsets:
    lv: 0.0
    rv: -0.005
    a: -0.010
  offsets_are_priors: true

# Predictive band: fraction of individual polls expected inside the shaded area.
band_coverage: 0.90

# Minimum polls before an average is published at all.
min_polls: 3

# Bar the average must clear before it drives `nat_env` in the seat models.
# Gate on stability, not on a poll count: twenty polls from one firm in one week
# are less trustworthy than eight from eight firms. `single_poll_influence_pp` is
# the largest move (in two-party margin points) that dropping any one poll
# produces in the current average; `firm_influence_pp` drops a whole firm.
#
# Thresholds are CALIBRATED, not picked (version 2, 2026-09-13). The archive's
# own firms, dates and sample sizes are simulated around the current estimate
# with sampling error and between-firm spread only, and the gate closes when
# observed influence exceeds the (1 - false_alarm_rate) quantile of what those
# healthy archives produce.
#
# Why it changed. Version 1 set the limit at 0.5x the aggregate's sampling SE.
# That compares the worst of N noisy drop-one moves against a per-aggregate
# error, and the maximum of many noisy numbers is usually large: on simulated
# archives with no real instability it closed 84% of weeks (80% on the prior
# week's structure). It closed on 2026-09-13 with the live archive at the 30th
# percentile of healthy ones, which would have zeroed the national environment
# in every forecast. Measured power of the calibrated gate: one poll 15 margin
# points off is caught 94% of the time, 25 points off 100%, 8 points off 27%.
environment_gate:
  min_polls: 8

  # Probability a healthy archive of this shape closes the gate by chance.
  false_alarm_rate: 0.05

  # Monte Carlo draws per archive. Fixed seed so a given archive always gets the
  # same threshold and the gate state is reproducible and auditable.
  null_sims: 400
  seed: 20260913

  # Between-firm spread in the null, estimated from the archive by median
  # absolute residual and clamped here (two-party margin points). Robust so the
  # polls being policed cannot widen the null they are judged against.
  house_effect_sd_bounds_pp: [0.5, 4.0]
